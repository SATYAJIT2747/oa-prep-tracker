<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OA Prep Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6fed'/><path d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">✓</span>
    <div>
      <h1>OA Prep Tracker</h1>
      <p class="sub" id="todayLabel"></p>
    </div>
  </div>
  <div class="today-stats">
    <div class="ring" id="ring" title="Questions done today">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="ring-bg" cx="22" cy="22" r="19"/><circle class="ring-fg" id="ringFg" cx="22" cy="22" r="19"/></svg>
      <span id="ringText">0/30</span>
    </div>
    <div class="stat"><span class="stat-num" id="streak">0</span><span class="stat-lbl">day streak</span></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
  </div>
</header>

<nav class="cats" id="cats" aria-label="Categories"></nav>

<div class="modes" role="tablist">
  <button class="mode" data-mode="today" role="tab">Today's set</button>
  <button class="mode" data-mode="browse" role="tab">Browse</button>
  <button class="mode" data-mode="progress" role="tab">Progress</button>
</div>

<main id="main"></main>

<dialog id="settings">
  <form method="dialog" class="settings">
    <h2>Settings</h2>
    <label class="row">Daily goal (questions)
      <input type="number" id="goalInput" min="1" max="300" step="1">
    </label>
    <label class="row">Shuffle today's set
      <input type="checkbox" id="shuffleInput">
    </label>
    <p class="hint">Progress is saved in this browser only. Export a backup now and then, and import it on another device or browser.</p>
    <div class="btn-row">
      <button type="button" class="btn" id="exportBtn">Export backup</button>
      <label class="btn">Import backup<input type="file" id="importInput" accept=".json,application/json" hidden></label>
      <button type="button" class="btn danger" id="resetBtn">Reset all progress</button>
    </div>
    <div class="btn-row end"><button class="btn primary" value="close">Done</button></div>
  </form>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
